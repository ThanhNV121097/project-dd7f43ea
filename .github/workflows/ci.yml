name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: code/backend/go.sum
      - name: Build
        run: cd code/backend && go build ./...
      - name: Vet
        run: cd code/backend && go vet ./...
      - name: Test
        run: cd code/backend && go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - name: Install
        run: cd code/frontend && npm ci
      - name: Lint
        run: cd code/frontend && npm run lint
      - name: Build
        run: cd code/frontend && npm run build
      - name: Test
        run: cd code/frontend && npm test --if-present

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose --profile local config -q
